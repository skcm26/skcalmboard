<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Satvik Calm Board</title>
  <style>
    :root{color-scheme:light;--deep:#702828;--key:#ad4b4b;--line:#a76767}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff7f7,#f2dada 55%,#d7aaaa);color:var(--deep);padding:clamp(12px,3vw,30px)}
    main{max-width:920px;margin:auto;padding:clamp(14px,3vw,28px);border:1px solid #c58e8e;border-radius:24px;background:rgba(255,250,250,.58);box-shadow:0 8px 28px rgba(92,31,31,.12)}
    h1{font-size:clamp(1.25rem,3vw,2rem);text-align:center;margin:0 0 16px;font-weight:650}
    #views{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
    .view-button{min-height:50px;border:2px solid var(--line);border-radius:14px;background:#fffafa;color:#642525;font-size:1.05rem;font-weight:700}
    .view-button[aria-selected="true"]{background:#762929;color:#fff;border-color:#642121}
    #word{width:100%;min-height:100px;padding:16px;border:3px solid #974747;border-radius:18px;background:#fffafa;color:#5f2020;text-align:center;text-transform:uppercase;font-size:clamp(2.2rem,7vw,4.5rem);letter-spacing:.07em;outline:none}
    #word:focus{border-color:#6f2929;box-shadow:0 0 0 4px rgba(133,55,55,.12)}
    #letters{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:18px 0}
    button{font:inherit;cursor:pointer;touch-action:manipulation}
    .letter{min-height:66px;border:1px solid #7b3030;border-radius:14px;background:var(--key);color:white;font-size:clamp(1.45rem,3.2vw,2.1rem);font-weight:700}
    .letter:active{background:#843535}
    #controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    #phraseBoard{margin:18px 0}
    .phrase-group{margin:0 0 18px}
    .category-button{width:100%;min-height:58px;padding:10px 16px;border:2px solid #914747;border-radius:14px;background:#8b3838;color:#fff;text-align:left;font-size:1.1rem;font-weight:750}
    .category-button::after{content:'+';float:right;font-size:1.35rem}
    .category-button[aria-expanded="true"]::after{content:'−'}
    .phrase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .phrase-grid[hidden]{display:none}
    .phrase-button{min-height:58px;padding:10px;border:1px solid #8b4444;border-radius:13px;background:#fffafa;color:#642525;font-size:1rem;font-weight:650}
    [hidden]{display:none!important}
    .control{min-height:58px;border:2px solid var(--line);border-radius:14px;background:#fffafa;color:#642525;font-size:clamp(1rem,2.2vw,1.25rem);font-weight:650}
    #read{background:#762929;color:white;border-color:#642121}
    @media(max-width:600px){#letters{grid-template-columns:repeat(5,1fr);gap:8px}.letter{min-height:58px}#controls{grid-template-columns:repeat(2,1fr)}.phrase-grid{grid-template-columns:repeat(2,1fr)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main>
    <h1>Satvik Calm Board</h1>
    <div id="views" role="tablist" aria-label="Board selection">
      <button id="spellView" class="view-button" type="button" role="tab" aria-selected="true">Spell Board</button>
      <button id="phraseView" class="view-button" type="button" role="tab" aria-selected="false">Phrase Board</button>
    </div>
    <label for="word" hidden>Type or spell a word</label>
    <input id="word" type="text" readonly inputmode="none" tabindex="-1" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Word spelled with the alphabet board">
    <div id="letters" aria-label="Alphabet board"></div>
    <div id="phraseBoard" aria-label="Phrase board" hidden></div>
    <div id="controls">
      <button class="control" id="read" type="button">Read Word</button>
      <button class="control" id="delete" type="button">Delete</button>
      <button class="control" id="space" type="button">Space</button>
      <button class="control" id="clear" type="button">Clear</button>
    </div>
  </main>
  <script>
    const vocabulary = new Set(`
      a able about above absolutely accept across act action active activity add afraid after afternoon again age ago agree air airplane airport all almost alone along already also always amazing am an and angry animal another answer any anyone anything apartment apple are area arm around arrive art artist as ask asleep at aunt awesome away
      baby back bag ball banana bathroom be bear bed bee before behind big bike bird book bottle boy bread breakfast brother bus butterfly
      beautiful best better brave bright busy cake calm camel can candy car care careful caregiver carry cat chair change cheese cheetah chicken child children choose city class clean clear clever clinic close clothes cloud cold color come comfortable community computer cook cookie cool correct counselor cow crab crocodile cub cup cute
      dad dance daughter day deer dentist desk dinner dinosaur doctor dog dolphin donkey door down draw dream drink drive duck
      eagle ear earth easy eat egg elephant emergency excited eye
      excellent face family fantastic far farm fast father favorite feel feeling feet fine fire firefighter first fish five flower fly food foot four fox free friend friendly frog front fruit full fun funny
      game garden giraffe girl give go goat good grape grass green group
      great hair hand happy hard have he head hear heart help helpful helper hen her here high hill hippo home hope horse hospital hot house hungry hurt
      i ice idea in inside is it jacket jar jellyfish juice jump kangaroo key keyboard kid kind kitchen kitten knee know
      lake lamp laugh learn left leg lemon letter library light like lion listen little look loud love lunch
      lucky made make man mango many map meal mean medicine milk minute mom monkey month moon more morning mother mouse mouth move movie much music must my
      name near neat need neighbor never new next nice night no nose not notebook now number nurse
      ocean octopus office on open orange other our outside owl
      ache ankle arm back belly body chest ear elbow eye face finger foot hand head headache hip hurt knee leg mouth neck nose pain painful page paint paper paramedic parent park party peacock pen pencil penguin people pet pharmacy phone piano picture pig pizza place plane plant plate play playground please police pony pool puppy sick sore stomach stomachache throat tooth toothache
      perfect pretty proud quiet rabbit rain ready read really red remember restaurant rice ride right river road robot room round run
      sad safe salad same sandwich say scared school sea seal see seven shark she sheep shirt shoe short show silly sing sister sit six sleep slow small smart smile snake snow so social socialworker sock sofa some song soon sorry sound soup space speak special speech spell spider spoon stand star start stay still stop store story strong street student super support surprised sweet sun
      table take talk tall teacher team teeth tell ten terrific thank thanks that the their them then there these therapist therapy they thing think thirsty this three tiger time tired to today together tomato too tooth toy train transportation tree truck try turn turtle two
      umbrella under up us use van very video wait wake walk want warm wash watch water way we well whale what wheel when where which white who why will window with wise wolf woman wonderful word work world wow write yellow yes you young zebra zero zoo
      appa amma satvik aide appointment assistant caseworker center communication device emotion familyname focus helmet idli medication musictherapist occupational occupationaltherapist principal psychologist routine safety sambar schoolbus sensory service services socialservices speechtherapist tablet timer roti dosa dosai chapati yogurt
      accident account address adult advice afternoon airport alone along already always ambulance amount angry another apartment arrive asleep attention autumn awake bakery bank baseball basket beach bean beautiful because become begin believe below belt bench beside between blanket block blood board boat borrow both bottom bowl brave break bridge bring broken brown build building button buy call carry catch cause celebrate change cheap check circle climb coat coffee college complete contact corner could count country cousin create cry cut dark decide deep different difficult direction dirty discover dish distance dream early east eight enough evening every everyone everything example explain fall famous farmer fear field fill find finish floor follow forest forget found free fresh friday gift glass glove grandpa grandma gray ground grow happen hard heavy history hold holiday honey how important insect interesting january job join july june keep kick large last late learn leave lesson line list live long lose machine march market match matter maybe may middle money monday mountain must myself nature nearly october often once only order oven own package pair pants past pay peanut pencil person pick picnic piece pillow place pocket present pull push question quickly reach remember repair repeat return rich rock roof round saturday save science season second send sentence september shape share short should shower side simple since skin skirt sky smell soft somebody someone something sometimes soon special spend spring stairs start station stick stone strong summer sunday swim take tall taste teach telephone television than thing third thought thousand through thursday ticket together touch town trip tuesday umbrella understand until usually vacation vegetable visit voice wait wall wear weather wednesday week welcome wet while whole winter wish without wood yesterday young
      ambulance autism behavior benefit careplan charity childservice citizen coach crisis disability education employment government guardian housing insurance interpreter legal mentalhealth nonprofit program protection resource shelter skill specialeducation supervisor volunteer welfare wheelchair
      airplane bicycle boat bus helicopter motorcycle rocket scooter ship subway taxi tractor transportation train tram truck van vehicle wagon wheel
      alligator alpaca ape baboon badger bat beaver bison buffalo caterpillar chimpanzee cobra coyote crow dove dragonfly falcon flamingo gorilla hamster hawk hedgehog insect jaguar koala ladybug leopard lizard lobster meerkat mosquito moth orangutan otter panda panther parrot pigeon polar bear rhinoceros rooster seahorse squirrel swan turkey walrus woodpecker
      avocado blueberry broccoli burger cabbage carrot cereal cherry coconut corn cracker cucumber grape lemon lettuce mango noodle onion pancake pasta peach pear pineapple popcorn potato rice salmon strawberry taco tuna vegetable watermelon waffle
      annoyed anxious bored confused curious disappointed embarrassed excited frustrated gentle glad grateful lonely nervous relaxed sleepy surprised upset worried
      bathroom bedroom cafeteria classroom elevator garage hallway kitchen laundry playground restaurant sidewalk stairs theater yard
      circle diamond heart oval rectangle square star triangle black blue brown gold gray green orange pink purple red silver white yellow
      ankle arm belly blood bone brain cheek chin ear elbow eye eyebrow face finger foot hair hand head heel hip knee leg lip mouth neck nose shoulder skin stomach throat thumb toe tongue tooth wrist
    `.trim().split(/\s+/));

    const phrases = new Set([
      'all done','i want','i need','i like','i do not like','my turn','your turn','come here','go home','go outside','take a break','play music','drink water','eat food','open door','close door','ride bike','wear helmet','good morning','good night','thank you','please help','help me','i am happy','i am sad','i am angry','i am tired','i am hungry','i am thirsty','i am hurt','i need help','i need a break','please stop','please wait','too loud','too bright','social worker','social services','community center','police officer','fire fighter','music therapist','speech therapist','occupational therapist','school counselor','bus driver'
    ]);
    const phraseGroups={
      'Needs':['I want water','I want food','I need help','I need a break','I need the bathroom','I am hungry','I am thirsty','I am tired','I am hurt'],
      'Sensory':['Too loud','Too bright','I need quiet','I need space','I need headphones','Please stop','Please wait','I feel overwhelmed','I feel calm'],
      'Feelings':['I am happy','I am sad','I am angry','I am scared','I am worried','I am excited','I feel sick','I have pain','I am okay'],
      'Social':['Hello','Goodbye','Thank you','Please help','My turn','Your turn','Come here','Yes please','No thank you'],
      'Activities':['I want to play','Play music','Go outside','Go home','Ride bike','Open door','Close door','All done','More please']
    };
    Object.values(phraseGroups).flat().forEach(phrase=>phrases.add(phrase.toLowerCase()));

    const input=document.querySelector('#word');
    const letters=document.querySelector('#letters');
    const phraseBoard=document.querySelector('#phraseBoard');
    const controls=document.querySelector('#controls');
    const spellView=document.querySelector('#spellView');
    const phraseView=document.querySelector('#phraseView');
    const readButton=document.querySelector('#read');
    let lastRead='';
    let activeUtterance=null;
    let phraseLockedUntil=0;
    let lastPhraseSpoken='';
    let phraseUnlockTimer=null;
    const PHRASE_PAUSE_MS=5000;
    const pendingLookups=new Set();
    let rememberedWords=[];
    try{rememberedWords=JSON.parse(localStorage.getItem('satvikDictionaryWords')||'[]')}catch{}
    rememberedWords.filter(word=>typeof word==='string').forEach(word=>vocabulary.add(word));

    function normalize(value){return String(value).trim().replace(/\s+/g,' ').toLowerCase()}
    function repetitive(value){
      const compact=value.replace(/\s/g,'');
      if (/^(.)\1{2,}$/.test(compact) || /^(.{1,4})\1{2,}$/.test(compact)) return true;
      const items=value.split(' ');
      return items.length>1 && new Set(items).size===1;
    }
    function meaningful(value){
      if (!value || repetitive(value)) return false;
      if (phrases.has(value)) return true;
      const parts=value.split(' ');
      return parts.length<=8 && parts.every(knownWord);
    }
    function knownWord(word){
      if(vocabulary.has(word)) return true;
      const candidates=[];
      if(word.endsWith('ies') && word.length>4) candidates.push(word.slice(0,-3)+'y');
      if(word.endsWith('es') && word.length>3) candidates.push(word.slice(0,-2),word.slice(0,-1));
      if(word.endsWith('s') && word.length>2) candidates.push(word.slice(0,-1));
      if(word.endsWith('ing') && word.length>5) candidates.push(word.slice(0,-3),word.slice(0,-3)+'e',word.slice(0,-4));
      if(word.endsWith('ed') && word.length>4) candidates.push(word.slice(0,-2),word.slice(0,-1),word.slice(0,-3));
      if(word.endsWith('er') && word.length>4) candidates.push(word.slice(0,-2),word.slice(0,-1));
      if(word.endsWith('ly') && word.length>4) candidates.push(word.slice(0,-2));
      return candidates.some(candidate=>vocabulary.has(candidate));
    }
    function changed(){
      lastRead='';
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
    function insert(text){
      input.value+=text;
      input.blur(); changed();
    }
    function speak(value){
      if(value===lastRead || !('speechSynthesis' in window)) return;
      lastRead=value;
      window.speechSynthesis.cancel();
      activeUtterance=new SpeechSynthesisUtterance(value);
      activeUtterance.lang='en-US'; activeUtterance.rate=.75; activeUtterance.pitch=1; activeUtterance.volume=1;
      const voices=window.speechSynthesis.getVoices();
      activeUtterance.voice=voices.find(v=>v.lang==='en-US') || voices.find(v=>v.lang?.startsWith('en')) || null;
      window.speechSynthesis.speak(activeUtterance);
    }
    function rememberWord(word){
      vocabulary.add(word);
      if(!rememberedWords.includes(word)) rememberedWords.push(word);
      rememberedWords=rememberedWords.slice(-1000);
      try{localStorage.setItem('satvikDictionaryWords',JSON.stringify(rememberedWords))}catch{}
    }
    async function readWord(){
      const value=normalize(input.value);
      if(!value || repetitive(value) || value===lastRead || !('speechSynthesis' in window)) return;
      if(meaningful(value)){speak(value);return}
      if(!/^[a-z'-]{2,30}$/.test(value) || pendingLookups.has(value) || !navigator.onLine) return;
      pendingLookups.add(value);
      try{
        const response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(value));
        if(!response.ok) return;
        const entries=await response.json();
        const valid=Array.isArray(entries) && entries.some(entry=>
          Array.isArray(entry.meanings) && entry.meanings.some(meaning=>
            Array.isArray(meaning.definitions) && meaning.definitions.length>0));
        if(valid && normalize(input.value)===value){rememberWord(value);speak(value)}
      }catch{
        /* Stay completely quiet if the dictionary or network is unavailable. */
      }finally{pendingLookups.delete(value)}
    }

    for(const letter of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){
      const button=document.createElement('button'); button.type='button'; button.className='letter'; button.textContent=letter;
      button.setAttribute('aria-label','Letter '+letter); button.addEventListener('click',()=>insert(letter)); letters.appendChild(button);
    }
    for(const [group,items] of Object.entries(phraseGroups)){
      const section=document.createElement('section');section.className='phrase-group';
      const heading=document.createElement('button');heading.type='button';heading.className='category-button';heading.textContent=group;heading.setAttribute('aria-expanded','false');section.appendChild(heading);
      const grid=document.createElement('div');grid.className='phrase-grid';grid.hidden=true;
      heading.addEventListener('click',()=>{
        const opening=grid.hidden;
        phraseBoard.querySelectorAll('.phrase-grid').forEach(item=>item.hidden=true);
        phraseBoard.querySelectorAll('.category-button').forEach(item=>item.setAttribute('aria-expanded','false'));
        grid.hidden=!opening;heading.setAttribute('aria-expanded',String(opening));
      });
      for(const phrase of items){
        const button=document.createElement('button');button.type='button';button.className='phrase-button';button.textContent=phrase;
        button.addEventListener('click',()=>{
          const selectedPhrase=normalize(phrase);
          if(Date.now()<phraseLockedUntil) return;
          if(selectedPhrase===lastPhraseSpoken) return;
          phraseLockedUntil=Date.now()+PHRASE_PAUSE_MS;
          lastPhraseSpoken=selectedPhrase;
          phraseBoard.style.pointerEvents='none';
          phraseBoard.setAttribute('aria-disabled','true');
          clearTimeout(phraseUnlockTimer);
          phraseUnlockTimer=setTimeout(()=>{
            phraseBoard.style.pointerEvents='';
            phraseBoard.removeAttribute('aria-disabled');
          },PHRASE_PAUSE_MS);
          if(normalize(input.value)!==normalize(phrase)){
            input.value=phrase;
            changed();
          }
          input.blur();
          speak(selectedPhrase);
        });grid.appendChild(button);
      }
      section.appendChild(grid);phraseBoard.appendChild(section);
    }
    function showBoard(board){
      const showPhrases=board==='phrases';
      letters.hidden=showPhrases;phraseBoard.hidden=!showPhrases;
      controls.hidden=showPhrases;
      spellView.setAttribute('aria-selected',String(!showPhrases));
      phraseView.setAttribute('aria-selected',String(showPhrases));
      readButton.textContent='Read Word';
      input.value='';input.blur();changed();
    }
    spellView.addEventListener('click',()=>showBoard('spell'));
    phraseView.addEventListener('click',()=>showBoard('phrases'));
    input.addEventListener('input',changed);
    input.addEventListener('pointerdown',event=>{event.preventDefault();input.blur()});
    input.addEventListener('focus',()=>input.blur());
    document.querySelector('#read').addEventListener('click',readWord);
    document.querySelector('#delete').addEventListener('click',()=>{
      input.value=input.value.slice(0,-1);
      input.blur(); changed();
    });
    document.querySelector('#space').addEventListener('click',()=>{if(input.value && !input.value.endsWith(' ')) insert(' ')});
    document.querySelector('#clear').addEventListener('click',()=>{input.value='';input.blur();changed()});
    window.addEventListener('pageshow',()=>setTimeout(()=>input.blur(),0));
    if('speechSynthesis' in window) window.speechSynthesis.getVoices();
  </script>
</body>
</html>
