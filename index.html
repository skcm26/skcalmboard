<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Satvik Calm Board</title>
  <style>
    :root{color-scheme:light;--deep:#702828;--key:#ad4b4b;--line:#a76767}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff7f7,#f2dada 55%,#d7aaaa);color:var(--deep);padding:clamp(12px,3vw,30px)}
    main{max-width:920px;margin:auto;padding:clamp(14px,3vw,28px);border:1px solid #c58e8e;border-radius:24px;background:rgba(255,250,250,.58);box-shadow:0 8px 28px rgba(92,31,31,.12)}
    h1{font-size:clamp(1.25rem,3vw,2rem);text-align:center;margin:0 0 16px;font-weight:650}
    #word{width:100%;min-height:100px;padding:16px;border:3px solid #974747;border-radius:18px;background:#fffafa;color:#5f2020;text-align:center;text-transform:uppercase;font-size:clamp(2.2rem,7vw,4.5rem);letter-spacing:.07em;outline:none}
    #word:focus{border-color:#6f2929;box-shadow:0 0 0 4px rgba(133,55,55,.12)}
    #letters{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:18px 0}
    button{font:inherit;cursor:pointer;touch-action:manipulation}
    .letter{min-height:66px;border:1px solid #7b3030;border-radius:14px;background:var(--key);color:white;font-size:clamp(1.45rem,3.2vw,2.1rem);font-weight:700}
    .letter:active{background:#843535}
    #controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .control{min-height:58px;border:2px solid var(--line);border-radius:14px;background:#fffafa;color:#642525;font-size:clamp(1rem,2.2vw,1.25rem);font-weight:650}
    #read{background:#762929;color:white;border-color:#642121}
    @media(max-width:600px){#letters{grid-template-columns:repeat(5,1fr);gap:8px}.letter{min-height:58px}#controls{grid-template-columns:repeat(2,1fr)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main>
    <h1>Satvik Calm Board</h1>
    <label for="word" hidden>Type or spell a word</label>
    <input id="word" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Type or spell a word">
    <div id="letters" aria-label="Alphabet board"></div>
    <div id="controls">
      <button class="control" id="read" type="button">Read Word</button>
      <button class="control" id="delete" type="button">Delete</button>
      <button class="control" id="space" type="button">Space</button>
      <button class="control" id="clear" type="button">Clear</button>
    </div>
  </main>
  <script>
    const vocabulary = new Set(`
      a able about above absolutely accept across act action active activity add afraid after afternoon again age ago agree air airplane airport all almost alone along already also always amazing am an and angry animal another answer any anyone anything apartment apple are area arm around arrive art artist as ask asleep at aunt awesome away
      baby back bag ball banana bathroom be bear bed bee before behind big bike bird book bottle boy bread breakfast brother bus butterfly
      beautiful best better brave bright busy cake calm camel can candy car care careful caregiver carry cat chair change cheese cheetah chicken child children choose city class clean clear clever clinic close clothes cloud cold color come comfortable community computer cook cookie cool correct counselor cow crab crocodile cub cup cute
      dad dance daughter day deer dentist desk dinner dinosaur doctor dog dolphin donkey door down draw dream drink drive duck
      eagle ear earth easy eat egg elephant emergency excited eye
      excellent face family fantastic far farm fast father favorite feel feeling feet fine fire firefighter first fish five flower fly food foot four fox free friend friendly frog front fruit full fun funny
      game garden giraffe girl give go goat good grape grass green group
      great hair hand happy hard have he head hear heart help helpful helper hen her here high hill hippo home hope horse hospital hot house hungry hurt
      i ice idea in inside is it jacket jar jellyfish juice jump kangaroo key keyboard kid kind kitchen kitten knee know
      lake lamp laugh learn left leg lemon letter library light like lion listen little look loud love lunch
      lucky made make man mango many map meal mean medicine milk minute mom monkey month moon more morning mother mouse mouth move movie much music must my
      name near neat need neighbor never new next nice night no nose not notebook now number nurse
      ocean octopus office on open orange other our outside owl
      page paint paper paramedic parent park party peacock pen pencil penguin people pet pharmacy phone piano picture pig pizza place plane plant plate play playground please police pony pool puppy
      perfect pretty proud quiet rabbit rain ready read really red remember restaurant rice ride right river road robot room round run
      sad safe salad same sandwich say scared school sea seal see seven shark she sheep shirt shoe short show silly sing sister sit six sleep slow small smart smile snake snow so social socialworker sock sofa some song soon sorry sound soup space speak special speech spell spider spoon stand star start stay still stop store story strong street student super support surprised sweet sun
      table take talk tall teacher team teeth tell ten terrific thank thanks that the their them then there these therapist therapy they thing think thirsty this three tiger time tired to today together tomato too tooth toy train transportation tree truck try turn turtle two
      umbrella under up us use van very video wait wake walk want warm wash watch water way we well whale what wheel when where which white who why will window with wise wolf woman wonderful word work world wow write yellow yes you young zebra zero zoo
      appa amma satvik aide appointment assistant caseworker center communication device emotion familyname focus helmet idli medication musictherapist occupational occupationaltherapist principal psychologist routine safety sambar schoolbus sensory service services socialservices speechtherapist tablet timer roti dosa dosai chapati yogurt
    `.trim().split(/\s+/));

    const phrases = new Set([
      'all done','i want','i need','i like','i do not like','my turn','your turn','come here','go home','go outside','take a break','play music','drink water','eat food','open door','close door','ride bike','wear helmet','good morning','good night','thank you','please help','help me','i am happy','i am sad','i am angry','i am tired','i am hungry','i am thirsty','i am hurt','i need help','i need a break','please stop','please wait','too loud','too bright','social worker','social services','community center','police officer','fire fighter','music therapist','speech therapist','occupational therapist','school counselor','bus driver'
    ]);

    const input=document.querySelector('#word');
    const letters=document.querySelector('#letters');
    let lastRead='';
    let activeUtterance=null;

    function normalize(value){return String(value).trim().replace(/\s+/g,' ').toLowerCase()}
    function repetitive(value){
      const compact=value.replace(/\s/g,'');
      if (/^(.)\1{2,}$/.test(compact) || /^(.{1,4})\1{2,}$/.test(compact)) return true;
      const items=value.split(' ');
      return items.length>1 && new Set(items).size===1;
    }
    function meaningful(value){
      if (!value || repetitive(value)) return false;
      if (phrases.has(value)) return true;
      const parts=value.split(' ');
      return parts.length<=8 && parts.every(part=>vocabulary.has(part));
    }
    function changed(){
      lastRead='';
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
    function insert(text){
      const start=input.selectionStart ?? input.value.length;
      const end=input.selectionEnd ?? input.value.length;
      input.value=input.value.slice(0,start)+text+input.value.slice(end);
      const next=start+text.length;
      input.focus(); input.setSelectionRange(next,next); changed();
    }
    function readWord(){
      const value=normalize(input.value);
      if (!meaningful(value) || value===lastRead || !('speechSynthesis' in window)) return;
      lastRead=value;
      window.speechSynthesis.cancel();
      activeUtterance=new SpeechSynthesisUtterance(value);
      activeUtterance.lang='en-US'; activeUtterance.rate=.75; activeUtterance.pitch=1; activeUtterance.volume=1;
      const voices=window.speechSynthesis.getVoices();
      activeUtterance.voice=voices.find(v=>v.lang==='en-US') || voices.find(v=>v.lang?.startsWith('en')) || null;
      window.speechSynthesis.speak(activeUtterance);
    }

    for(const letter of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){
      const button=document.createElement('button'); button.type='button'; button.className='letter'; button.textContent=letter;
      button.setAttribute('aria-label','Letter '+letter); button.addEventListener('click',()=>insert(letter)); letters.appendChild(button);
    }
    input.addEventListener('input',changed);
    document.querySelector('#read').addEventListener('click',readWord);
    document.querySelector('#delete').addEventListener('click',()=>{
      const start=input.selectionStart ?? input.value.length, end=input.selectionEnd ?? input.value.length;
      if(start!==end){input.value=input.value.slice(0,start)+input.value.slice(end);input.setSelectionRange(start,start)}
      else if(start>0){input.value=input.value.slice(0,start-1)+input.value.slice(start);input.setSelectionRange(start-1,start-1)}
      input.focus(); changed();
    });
    document.querySelector('#space').addEventListener('click',()=>{if(input.value && !input.value.endsWith(' ')) insert(' ')});
    document.querySelector('#clear').addEventListener('click',()=>{input.value='';input.focus();changed()});
    if('speechSynthesis' in window) window.speechSynthesis.getVoices();
  </script>
</body>
</html>
